name: wake box

# Enabled by the box (t3-wake sync) when T3 Code threads are waiting on a
# limit (WAKE_AT = reset time) or agents are working (WAKE_AT = busy);
# disables itself once WAKE_AT = none.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Wake the box now and print T3 status (ignores WAKE_AT)"
        type: boolean
        default: false

permissions:
  actions: write

concurrency:
  group: wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOX: box-8889b2
      WAKE_AT: ${{ vars.WAKE_AT }}
      LEAD_MINUTES: "20"   # wake this long before the reset
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      INSTABOX_NO_UPDATE_CHECK: "1"
      IB: npx -y instabox@0.8.245
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide
        id: d
        run: |
          act=none
          if [ "${{ inputs.test }}" = true ]; then
            echo "Test run: waking box and printing status."
            echo "act=test" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$WAKE_AT" ] || [ "$WAKE_AT" = none ]; then
            echo "Nothing waiting on a limit."
            act=disable
          elif [ "$WAKE_AT" = busy ]; then
            echo "Agents are working; keeping the box awake after any pause."
            act=wake
          else
            now=$(date -u +%s); reset=$(date -u -d "$WAKE_AT" +%s)
            if   [ "$now" -lt $((reset - LEAD_MINUTES*60)) ]; then echo "Reset at $WAKE_AT; too early to wake."
            elif [ "$now" -lt $((reset + 5*60)) ];          then echo "Reset at $WAKE_AT; waking box."; act=wake
            elif [ "$now" -lt $((reset + 6*3600)) ];        then echo "Reset at $WAKE_AT passed; waking and checking."; act=check
            else echo "WAKE_AT $WAKE_AT is stale."; act=disable
            fi
          fi
          echo "act=$act" >> "$GITHUB_OUTPUT"

      - name: Wake box
        if: steps.d.outputs.act == 'wake' || steps.d.outputs.act == 'check' || steps.d.outputs.act == 'test'
        run: $IB wake "$BOX" || echo "::warning::wake failed (cooldown or error); will retry next run"

      - name: Make sure T3 Code and T3 Connect work
        if: steps.d.outputs.act == 'wake' || steps.d.outputs.act == 'check' || steps.d.outputs.act == 'test'
        run: $IB exec "$BOX" -- .local/bin/t3-wake ensure || echo "::warning::T3 not healthy yet; will retry next run"

      - name: Test - box status
        if: steps.d.outputs.act == 'test'
        run: $IB exec "$BOX" -- sh -c '.local/bin/t3-wake status | sed -E "s/^([^ ]+)  .*/\1  waiting thread/"; systemctl --user is-active t3code.service t3-wake-sync.timer'

      - name: Check T3 Code resumed
        if: steps.d.outputs.act == 'check'
        run: $IB exec "$BOX" -- .local/bin/t3-wake check || echo "::warning::check failed; will retry next run"

      - name: Disable this schedule
        if: steps.d.outputs.act == 'disable'
        run: gh workflow disable wake.yml -R "$GITHUB_REPOSITORY"
