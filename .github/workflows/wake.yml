name: wake box

# The box (t3-wake sync) sets WAKE_AT / T3_BUSY and starts the watchdog run
# whenever they change. The watchdog stays running and checks the box every
# minute (GitHub's cron is too late and too sparse to wake on time).
# The schedule is only a backup: it starts a watchdog if none is running.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Wake the box now and print T3 status, then keep watching"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

env:
  BOX: box-8889b2
  WAKE_AT: ${{ vars.WAKE_AT }}
  T3_BUSY: ${{ vars.T3_BUSY }}
  GH_TOKEN: ${{ github.token }}

jobs:
  backup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start the watchdog if needed
        run: |
          if { [ -z "$WAKE_AT" ] || [ "$WAKE_AT" = none ]; } && [ "$T3_BUSY" != 1 ]; then
            echo "Nothing waiting and no agents working."; exit 0
          fi
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w wake.yml -e workflow_dispatch -L 20 \
                --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$n" -gt 0 ]; then echo "Watchdog is running."; exit 0; fi
          echo "::warning::No watchdog running; starting one."
          gh workflow run wake.yml -R "$GITHUB_REPOSITORY"

  watchdog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: watchdog
      cancel-in-progress: true   # a newer run (new WAKE_AT / T3_BUSY) takes over
    env:
      TEST: ${{ inputs.test }}
      LEAD_MINUTES: "20"   # wake this long before the reset
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      INSTABOX_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g instabox@0.8.289
      - run: python3 .github/watchdog.py
